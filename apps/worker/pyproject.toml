[project]
name = "gex-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gex-common",
    "faststream[rabbit,cli]>=0.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.10",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gex_worker"]
