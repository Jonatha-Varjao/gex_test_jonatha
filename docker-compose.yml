version: "3.9"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gexroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gex}
      MYSQL_USER: ${MYSQL_USER:-gex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gex}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql
      - ./sql/002_indexes.sql:/docker-entrypoint-initdb.d/002_indexes.sql
      - ./sql/003_stored_procs.sql:/docker-entrypoint-initdb.d/003_stored_procs.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
  rabbitmq_data:
