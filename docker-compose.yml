# ─────────────────────────────────────────────────────────────────────────────
# GEX Webhook Pipeline — full stack
#
# Quick start (host only needs Docker):
#   1. cp .env.example .env   (fill GRUMMER_SECRET_HEX + WEBHOOK_SITE_URL)
#   2. docker compose up -d --build
#   3. docker compose --profile e2e up e2e-driver   (optional E2E run)
# ─────────────────────────────────────────────────────────────────────────────

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gexroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gex}
      MYSQL_USER: ${MYSQL_USER:-gex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gex}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql
      - ./sql/002_indexes.sql:/docker-entrypoint-initdb.d/002_indexes.sql
      - ./sql/003_stored_procs.sql:/docker-entrypoint-initdb.d/003_stored_procs.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Apps ────────────────────────────────────────────────────────────────
  # Build context is the repo root (uv needs the workspace). The two
  # Dockerfiles are colocated with their respective apps:
  #   apps/receiver/Dockerfile  →  gex_test_jonatha-receiver
  #   apps/worker/Dockerfile    →  gex_test_jonatha-worker
  # The receiver image does NOT contain worker code and vice-versa.

  receiver:
    build:
      context: .
      dockerfile: apps/receiver/Dockerfile
    image: gex_test_jonatha-receiver:latest
    environment:
      DATABASE_URL: mysql+asyncmy://gex:gex@mysql:3306/gex
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRUMMER_SECRET_HEX: ${GRUMMER_SECRET_HEX:?set in .env}
      WEBHOOK_SITE_URL: ${WEBHOOK_SITE_URL:-}
      SMS_FAILURE_RATE: ${SMS_FAILURE_RATE:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: docker
      MAX_REQUEST_SIZE_KB: ${MAX_REQUEST_SIZE_KB:-1024}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: gex_test_jonatha-worker:latest
    environment:
      DATABASE_URL: mysql+asyncmy://gex:gex@mysql:3306/gex
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GRUMMER_SECRET_HEX: ${GRUMMER_SECRET_HEX:?set in .env}
      WEBHOOK_SITE_URL: ${WEBHOOK_SITE_URL:-}
      SMS_FAILURE_RATE: ${SMS_FAILURE_RATE:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: docker
      CONSUMER_CONCURRENCY: ${CONSUMER_CONCURRENCY:-1}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      receiver:
        condition: service_started
    restart: unless-stopped

  # ── E2E driver (opt-in via --profile e2e) ───────────────────────────────
  # One-shot container that POSTs data/webhook_payloads.json to the receiver
  # and exits. Use:
  #   docker compose --profile e2e up e2e-driver
  # Override concurrency / repeats via:
  #   docker compose --profile e2e run e2e-driver -- --concurrency 50 --repeat 3
  e2e-driver:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    image: gex_test_jonatha-e2e:latest
    profiles: ["e2e"]
    depends_on:
      receiver:
        condition: service_started
    restart: "no"

volumes:
  mysql_data:
  rabbitmq_data:
