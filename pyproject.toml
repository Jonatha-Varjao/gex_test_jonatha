[project]
name = "gex-test-jonatha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (require MySQL/RabbitMQ via testcontainers)",
    "slow: tests that take >5 seconds",
]
addopts = "--cov-report=html"

[tool.coverage.run]
source = ["gex_common", "gex_receiver", "gex_worker"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.vulture]
paths = ["libs", "apps", "tests"]
ignore_names = [
    "first_name", "last_name", "country", "id", "niche",
    "amount_usd", "method", "status", "transaction_id", "transaction_time",
    "order_id", "channel", "original_payload", "error_reason", "error_detail",
    "queue_origin",
    "database_url", "database_pool_size", "database_max_overflow",
    "rabbitmq_url", "grummer_secret_hex", "webhook_site_url",
    "sms_failure_rate", "log_level", "environment", "model_config",
    "max_request_size_kb", "consumer_concurrency",
    "app", "main", "is_valid",
]
ignore_decorators = ["pytest.fixture", "pytest.mark.*"]
make_whitelist = false

[tool.ruff]
src = ["libs/common/src", "apps/receiver/src", "apps/worker/src", "tests"]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv.workspace]
members = [
    "libs/common",
    "apps/receiver",
    "apps/worker",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.15.15",
    "testcontainers[mysql,rabbitmq]>=4.0",
    "vulture>=2.16",
]
